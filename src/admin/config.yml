backend:
  name: github
  repo: ByDamon/cuaderno-de-damon
  branch: main

# Guarda los cambios directamente al hacer clic en "Publicar" dentro del panel.
publish_mode: simple
media_folder: "src/img"
public_folder: "/img"

collections:
  - name: "entradas"
    label: "Entradas"
    label_singular: "Entrada"
    folder: "src/entradas"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{fields.categoria}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - label: "Categoría"
        name: "categoria"
        widget: "select"
        options:
          - { label: "🟣 Medicina", value: "medicina" }
          - { label: "🔵 Universo", value: "universo" }
          - { label: "🟢 Ciencia general", value: "ciencia" }
          - { label: "🟡 Reflexiones", value: "reflexiones" }
          - { label: "🟠 Tecnología y futuro", value: "tecnologia" }
      - label: "Madurez de la idea"
        name: "madurez"
        widget: "select"
        default: "desarrollo"
        options:
          - { label: "🌱 Idea en boceto", value: "boceto" }
          - { label: "🌿 En desarrollo", value: "desarrollo" }
          - { label: "🌳 Idea madura", value: "madura" }
        hint: "¿Qué tan tendida está esta idea? Puedes subirla de nivel cuando la vuelvas a trabajar."
      - label: "Fecha"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - { label: "Resumen (para la tarjeta)", name: "resumen", widget: "string" }
      - { label: "Explicación simple", name: "explicacion", widget: "markdown", minimal: true }
      - { label: "Dibujo mental (analogía)", name: "analogia", widget: "markdown", minimal: true }
      - { label: "Puente con otro tema", name: "puente", widget: "markdown", minimal: true }
      - label: "Entradas relacionadas"
        name: "relacionadas"
        widget: "relation"
        collection: "entradas"
        search_fields: ["title"]
        display_fields: ["title"]
        value_field: "{{slug}}"
        multiple: true
        required: false
        hint: "Elige otras entradas con las que esta se conecta. Alimentan el Mapa de conexiones."
      - { label: "Para seguir pensando", name: "reflexion", widget: "text" }
      - { label: "Etiquetas", name: "tags", widget: "list", required: false }
      - {
          label: "Notas adicionales (opcional)",
          name: "body",
          widget: "markdown",
          required: false,
          minimal: true,
        }
      - {
          label: "Layout",
          name: "layout",
          widget: "hidden",
          default: "layouts/entrada.njk",
        }

  - name: "ajustes"
    label: "Ajustes del sitio"
    editor:
      preview: false
    files:
      - label: "Textos generales"
        name: "general"
        file: "src/_data/site.json"
        fields:
          - { label: "Título del sitio", name: "titulo", widget: "string" }
          - { label: "Subtítulo (debajo del título)", name: "subtitulo", widget: "string" }
          - {
              label: "Introducción de la portada",
              name: "introPortada",
              widget: "text",
            }
          - {
              label: "Nombre del autor (pie de página)",
              name: "autor",
              widget: "string",
            }
          - {
              label: "Descripción del sitio (para buscadores)",
              name: "descripcion",
              widget: "text",
            }
          - { label: "URL del sitio", name: "url", widget: "string" }
          - { label: "Instagram (link completo)", name: "instagramUrl", widget: "string", required: false }
          - { label: "X / Twitter (link completo)", name: "xUrl", widget: "string", required: false }
